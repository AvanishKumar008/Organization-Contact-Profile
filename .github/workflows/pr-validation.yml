# PR Validation - Deploy to Scratch Org and Validate
# Triggers on pull_request to main
# Must pass before merge (NFR-005, NFR-006, NFR-007)

name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'force-app/**'
      - 'config/**'
      - 'sfdx-project.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to DevHub
        env:
          SF_DEVHUB_AUTH_URL: ${{ secrets.SF_DEVHUB_AUTH_URL }}
        run: |
          # Support raw URL or base64-encoded; remove newlines (secrets may wrap when pasted)
          AUTH_INPUT=$(echo -n "$SF_DEVHUB_AUTH_URL" | tr -d '\n')
          if [[ "$AUTH_INPUT" == force://* ]]; then
            echo -n "$AUTH_INPUT" > auth_url.txt
          else
            echo -n "$AUTH_INPUT" | base64 -d | tr -d '\n' > auth_url.txt
          fi
          sf org login sfdx-url --sfdx-url-file auth_url.txt --alias DevHub --set-default --set-default-dev-hub

      - name: Create Scratch Org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --target-dev-hub DevHub \
            --alias "pr-${{ github.event.pull_request.number || github.run_id }}" \
            --set-default \
            --duration-days 1

      - name: Deploy to Scratch Org
        run: |
          sf project deploy start \
            --source-dir force-app/main/default \
            --target-org pr-${{ github.event.pull_request.number || github.run_id }} \
            --wait 10

      - name: Delete Scratch Org
        if: always()
        continue-on-error: true
        run: |
          sf org delete scratch \
            --target-org pr-${{ github.event.pull_request.number || github.run_id }} \
            --no-prompt || true
