# Deploy on Merge - Deploy to Developer Org after PR merge
# Triggers on push to main (after merge)
# NFR-005

name: Deploy on Merge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Developer Org
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Target Org
        env:
          SF_AUTH_URL: ${{ secrets.SF_DEV_ORG_AUTH_URL }}
        run: |
          # Support raw URL or base64-encoded; remove newlines (secrets may wrap when pasted)
          AUTH_INPUT=$(echo -n "$SF_AUTH_URL" | tr -d '\n')
          if [[ "$AUTH_INPUT" == force://* ]]; then
            echo -n "$AUTH_INPUT" > auth_url.txt
          else
            echo -n "$AUTH_INPUT" | base64 -d | tr -d '\n' > auth_url.txt
          fi
          sf org login sfdx-url --sfdx-url-file auth_url.txt --alias dev --set-default

      - name: Deploy to Developer Org
        run: |
          sf project deploy start \
            --source-dir force-app/main/default \
            --target-org dev \
            --wait 10
